<div class="calendar">

  <!-- Header -->
  <div class="calendar-header">
    <button (click)="prevMonth()">◀</button>
    <h4>{{ currentDate | date:'MMMM yyyy' }}</h4>
    <button (click)="nextMonth()">▶</button>
  </div>

  <!-- Weekdays -->
  <div class="weekdays">
    <div *ngFor="let d of ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']">
      {{ d }}
    </div>
  </div>

  <!-- Days -->
  <div class="days">
    <div
      *ngFor="let day of days"
      class="day"
      [ngClass]="{
        'attendance': day && hasAttendance(day),
        'leave': day && hasLeave(day)
      }"
    >
      <span *ngIf="day">{{ day.getDate() }}</span>
    </div>
  </div>

</div>
